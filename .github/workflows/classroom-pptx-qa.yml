name: Classroom PPTX QA

on:
  workflow_dispatch:
    inputs:
      pptx_path:
        description: "Repository-relative PPTX path. Leave empty to scan qa-input/*.pptx"
        required: false
        default: ""
      profile:
        description: "Classroom QA profile"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - standard
          - flowchart
      allow_static:
        description: "Allow a deck without click-reveal animation (only if explicitly requested)"
        required: false
        default: false
        type: boolean
      notes_optional:
        description: "Allow missing speaker notes (only if explicitly requested)"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
    paths:
      - "scripts/classroom_style_policy.py"
      - "scripts/normalize_classroom_style.py"
      - "scripts/test_classroom_style_policy.py"
      - "scripts/check_classroom_deck.py"
      - "scripts/check_classroom_hard_gates.py"
      - "scripts/check_classroom_delivery.py"
      - "scripts/render_classroom_deck.sh"
      - "scripts/make_contact_sheet.py"
      - "references/classroom-*.md"
      - "CLASSROOM.md"
      - "AGENTS.md"
      - ".github/workflows/classroom-pptx-qa.yml"

  pull_request:
    paths:
      - "qa-input/**/*.pptx"
      - "scripts/classroom_style_policy.py"
      - "scripts/normalize_classroom_style.py"
      - "scripts/test_classroom_style_policy.py"
      - "scripts/check_classroom_deck.py"
      - "scripts/check_classroom_hard_gates.py"
      - "scripts/check_classroom_delivery.py"
      - "scripts/render_classroom_deck.sh"
      - "scripts/make_contact_sheet.py"
      - "references/classroom-*.md"
      - "CLASSROOM.md"
      - "AGENTS.md"
      - ".github/workflows/classroom-pptx-qa.yml"

jobs:
  classroom-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install renderer and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice \
            poppler-utils \
            fonts-noto-cjk \
            fonts-liberation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade python-pptx pillow

      - name: Compile classroom QA scripts
        run: |
          python -m py_compile \
            scripts/classroom_style_policy.py \
            scripts/normalize_classroom_style.py \
            scripts/test_classroom_style_policy.py \
            scripts/check_classroom_deck.py \
            scripts/check_classroom_hard_gates.py \
            scripts/check_classroom_delivery.py \
            scripts/make_contact_sheet.py

      - name: Borderless policy smoke test
        run: python3 scripts/test_classroom_style_policy.py

      - name: Resolve PPTX inputs
        id: decks
        shell: bash
        env:
          REQUESTED: ${{ github.event.inputs.pptx_path || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          : > qa-artifacts/decks.txt
          if [[ -n "$REQUESTED" ]]; then
            [[ -f "$REQUESTED" ]] || { echo "PPTX not found: $REQUESTED" >&2; exit 2; }
            printf '%s\n' "$REQUESTED" >> qa-artifacts/decks.txt
          else
            find qa-input -type f -iname '*.pptx' -print | sort >> qa-artifacts/decks.txt || true
          fi

          if [[ ! -s qa-artifacts/decks.txt ]]; then
            if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "::notice::No PPTX in qa-input. Policy/script CI passed, but NO deck was validated."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No PPTX found. Put a deck under qa-input/ or set pptx_path." >&2
            exit 2
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          cat qa-artifacts/decks.txt

      - name: Machine QA and render all decks
        if: steps.decks.outputs.skip != 'true'
        shell: bash
        env:
          PROFILE: ${{ github.event.inputs.profile || 'auto' }}
          ALLOW_STATIC: ${{ github.event.inputs.allow_static || 'false' }}
          NOTES_OPTIONAL: ${{ github.event.inputs.notes_optional || 'false' }}
        run: |
          set -euo pipefail
          failed=0

          extra=()
          if [[ "$ALLOW_STATIC" == "true" ]]; then
            extra+=(--allow-static)
          fi
          if [[ "$NOTES_OPTIONAL" == "true" ]]; then
            extra+=(--notes-optional)
          fi

          while IFS= read -r deck; do
            [[ -n "$deck" ]] || continue
            stem="$(basename "$deck" .pptx)"
            out="qa-artifacts/$stem"
            mkdir -p "$out"

            echo "::group::General QA — $deck"
            if ! python3 scripts/check_deck.py "$deck" | tee "$out/check_deck.txt"; then
              failed=1
            fi
            echo "::endgroup::"

            echo "::group::Classroom Hard Gates — $deck"
            if ! python3 scripts/check_classroom_hard_gates.py \
              "$deck" \
              --profile "$PROFILE" \
              --json "$out/hard-gates.json" \
              "${extra[@]}" \
              | tee "$out/hard-gates.txt"; then
              failed=1
            fi
            echo "::endgroup::"

            echo "::group::Classroom Detailed QA — $deck"
            if ! python3 scripts/check_classroom_deck.py \
              "$deck" \
              --json "$out/classroom-qa.json" \
              | tee "$out/classroom-qa.txt"; then
              failed=1
            fi
            echo "::endgroup::"

            echo "::group::Render — $deck"
            bash scripts/render_classroom_deck.sh "$deck" "$out/rendered"
            echo "::endgroup::"

            printf '%s\n' \
              'Rendering succeeded, but the deck is NOT delivery-ready yet.' \
              'Review every rendered PNG using references/classroom-visual-qa-v3.md,' \
              'create visual-qa.json, rerender after any fixes, then run:' \
              'python3 scripts/check_classroom_delivery.py --machine hard-gates.json --visual visual-qa.json' \
              > "$out/VISUAL_QA_REQUIRED.txt"
          done < qa-artifacts/decks.txt

          # Rendering artifacts are uploaded even on QA failure in the next step.
          exit "$failed"

      - name: Upload rendered QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-pptx-qa
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 14
