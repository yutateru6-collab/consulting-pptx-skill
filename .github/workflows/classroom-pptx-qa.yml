name: Classroom PPTX QA

on:
  workflow_dispatch:
    inputs:
      pptx_path:
        description: "Repository-relative PPTX path. Leave empty to scan qa-input/*.pptx"
        required: false
        default: ""
  pull_request:
    paths:
      - "qa-input/**/*.pptx"
      - "scripts/check_classroom_deck.py"
      - "scripts/render_classroom_deck.sh"
      - "scripts/make_contact_sheet.py"
      - "references/classroom-*.md"
      - ".github/workflows/classroom-pptx-qa.yml"

jobs:
  classroom-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install renderer and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice \
            poppler-utils \
            fonts-noto-cjk \
            fonts-liberation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade python-pptx pillow

      - name: Resolve PPTX inputs
        id: decks
        shell: bash
        env:
          REQUESTED: ${{ github.event.inputs.pptx_path || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          : > qa-artifacts/decks.txt
          if [[ -n "$REQUESTED" ]]; then
            [[ -f "$REQUESTED" ]] || { echo "PPTX not found: $REQUESTED" >&2; exit 2; }
            printf '%s\n' "$REQUESTED" >> qa-artifacts/decks.txt
          else
            find qa-input -type f -iname '*.pptx' -print | sort >> qa-artifacts/decks.txt || true
          fi
          if [[ ! -s qa-artifacts/decks.txt ]]; then
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              echo "No PPTX in qa-input; skipping deck QA for this PR."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No PPTX found. Put a deck under qa-input/ or set pptx_path." >&2
            exit 2
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          cat qa-artifacts/decks.txt

      - name: Machine QA and render all decks
        if: steps.decks.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r deck; do
            [[ -n "$deck" ]] || continue
            stem="$(basename "$deck" .pptx)"
            out="qa-artifacts/$stem"
            mkdir -p "$out"

            echo "::group::General QA — $deck"
            if ! python3 scripts/check_deck.py "$deck" | tee "$out/check_deck.txt"; then
              failed=1
            fi
            echo "::endgroup::"

            echo "::group::Classroom QA — $deck"
            if ! python3 scripts/check_classroom_deck.py "$deck" --json "$out/classroom-qa.json" | tee "$out/classroom-qa.txt"; then
              failed=1
            fi
            echo "::endgroup::"

            echo "::group::Render — $deck"
            bash scripts/render_classroom_deck.sh "$deck" "$out/rendered"
            echo "::endgroup::"
          done < qa-artifacts/decks.txt

          # Rendering artifacts are uploaded even on QA failure in the next step.
          exit "$failed"

      - name: Upload rendered QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-pptx-qa
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 14
